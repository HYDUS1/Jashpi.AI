services:
  - type: web
    name: jashpi
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /info
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: POLLINATIONS_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: jashpi-data
      mountPath: /data
      sizeGB: 1
