<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1030"><title>JASHPI AI</title>
<link rel="icon" id="fav"><link rel="manifest" id="mf"><link rel="apple-touch-icon" id="ati">
<style>
:root{--ink:#0B1030;--card:#151B47;--line:#262e66;--tx:#EEF1FF;--mu:#9aa3d6;--b:#2F6BFF;--c:#19D3F2;--v:#8B5CF6;--r:#FF3D5A;--g:linear-gradient(135deg,var(--b),var(--c) 50%,var(--v))}
html{overscroll-behavior:none}body:has(.ov.s){overflow:hidden}body{touch-action:manipulation}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px 16px 96px}
h2{font-size:22px;margin:6px 0 12px}h3{margin:0 0 6px;font-size:16px}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0 10px}.bar b{font-size:18px;letter-spacing:.3px}
.chip{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.chip.on{border-color:var(--c);color:var(--c)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;background:#0d1238;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button.g{background:#222a5e}button.d{background:var(--r)}button:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.hero{display:grid;place-items:center;padding:18px 0 6px}
.ring{width:236px;height:236px;border-radius:50%;padding:7px;background:conic-gradient(var(--b),var(--c),var(--v),var(--b));display:grid;place-items:center}
.ring.live{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sosb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7088,var(--r) 60%,#c4163a);display:grid;place-items:center;font-size:44px;font-weight:800;letter-spacing:2px;box-shadow:0 0 40px #ff3d5a66;animation:none}
.ring.live .sosb{animation:cnt 6s linear infinite reverse}@keyframes cnt{to{transform:rotate(360deg)}}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tg div{background:#0d1238;border-radius:12px;padding:10px;text-align:center;font-size:13px}.tg b{display:block;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1440ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:12px 1px;font-size:12px;color:var(--mu)}nav button.a{color:var(--c)}
.ov{height:100dvh;position:fixed;inset:0;background:#0B1030f2;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;overflow:auto}.ov.s{display:flex}
.big{font-size:96px;font-weight:800}.opt{width:100%;max-width:340px;padding:18px;font-size:20px}
.ct{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.ct span{flex:1}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:340px}.cal button{background:#222a5e;font-size:24px;padding:16px 0}.cal button:active{transform:none;filter:brightness(1.4)}.cal button.o{background:#ff9f0a}
#disp{width:100%;max-width:340px;text-align:right;font-size:48px;min-height:64px;overflow:hidden}
a.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#222a5e;padding:12px;border-radius:12px;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:12px 14px}summary{font-weight:700;cursor:pointer}
.gi{width:100%;aspect-ratio:8/5;border-radius:12px;margin-top:10px;background:linear-gradient(90deg,#1b2260,#2a3382,#1b2260);background-size:200% 100%;animation:sh 1.4s linear infinite;object-fit:cover;opacity:.9}.gi.ok{animation:pop .7s ease both;background:none}
@keyframes sh{to{background-position:-200% 0}}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
details[open] li{animation:up .5s ease both}details li:nth-child(2){animation-delay:.1s}details li:nth-child(3){animation-delay:.2s}details li:nth-child(4){animation-delay:.3s}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.heart{font-size:64px;text-align:center}.heart.b{animation:beat .545s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.25)}}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl button{padding:16px 8px}
pre{white-space:pre-wrap;font:12px/1.4 monospace;max-height:160px;overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>

function track(){if(wid!=null||!navigator.geolocation)return;tid=tid||rnd(10);wid=navigator.geolocation.watchPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude};if(Date.now()-lastT>5000){lastT=Date.now();post('/track',{id:tid,name:S.name,...lastPos}).catch(()=>{})}},()=>{},{enableHighAccuracy:true})}

function alarm(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=.4;o.start();let f=700;siren=setInterval(()=>{f=f==700?1100:700;o.frequency.value=f},400);siren.stop=()=>{clearInterval(siren);o.stop();a.close()}}catch(e){}}
async function sos(why,silent){
 if(busy)return;busy=true;setTimeout(()=>busy=false,20000);log('SOS: '+why);
 if(navigator.vibrate&&!silent)navigator.vibrate([400,150,400,150,400]);
 const p=await pos();track();
 const map=p?`https://maps.google.com/?q=${p.lat},${p.lng}`:'(location unavailable)',live=`${RELAY()}/t/${tid}`;
 const text=`${S.name||'User'} ${T().msg} ${map} | Live: ${live}`;
 let r={};try{if(p)await post('/track',{id:tid,name:S.name,...p});r=await post('/sos',{code:S.code,ids:S.tg||[],text,...(p||{})})}catch(e){log('relay '+e);addEventListener('online',()=>post('/sos',{code:S.code,text}).catch(()=>{}),{once:true})}
 if(APP)try{Jashpi.sos(text,!!silent)}catch(e){}
 if(silent)return;
 alarm();const c=S.contacts||[],n=c.map(x=>x.phone.replace(/\D/g,''));
 if(!APP&&n[0]&&navigator.userActivation&&navigator.userActivation.isActive)location.href='tel:+'+n[0];
 sheet(`<h2>${T().sent}</h2><p class="mu">Telegram: ${r.sent||0}</p>`+
 (n.length?`<a class="btn opt" href="sms:${n.map(x=>'+'+x).join(',')}?body=${encodeURIComponent(text)}">SMS (all)</a>`+c.map((x,i)=>`<a class="btn opt" target="_blank" href="https://wa.me/${n[i]}?text=${encodeURIComponent(text)}">WhatsApp: ${esc(x.name)}</a>`).join('')+`<a class="btn opt" href="tel:+${n[0]}">${T().call} ${esc(c[0].name)}</a>`:'<p>Add contacts first.</p>')+
 `<a class="btn opt" href="tel:112">112</a><button class="g opt" onclick="closeSheet()">OK</button>`)}
function sheet(h){const o=$('#ov');o.innerHTML=h;o.classList.add('s')}

let cd=null;
function ask(why,secs,msg){if(cd||busy)return;let n=secs;const draw=()=>sheet(`<div class="mu">${msg||T().sending}</div><div class="big">${n}</div><button class="d opt" onclick="stopCd()">${msg?T().ok:T().cancel}</button>`);draw();if(navigator.vibrate)navigator.vibrate(200);cd=setInterval(()=>{if(--n<=0){stopCd();sos(why)}else draw()},1000)}

/* ---------- triggers: voice (SpeechRecognition) ---------- */
const hits={bachao:[],help:[]},seen={};let rec=null,mic=APP,stats={bachao:0,help:0,cough:0};
const RX={wake:/hello\s*j[ae]s?h?\s*p[iy]|hello\s*jaspi|हैलो\s*ज[शस]्?पी/,bachao:/bacha+o|bachav|बचाओ|बचाव/g,help:/\bhelp\b|हेल्प|madad|madat|मदद/g};
function feed(i,t){
 if(S.off)return;
 if(RX.wake.test(t)&&!seen['w'+i]){seen['w'+i]=1;ask('wake word',5)}
 for(const k of['bachao','help']){const n=(t.match(RX[k])||[]).length,p=seen[k+i]||0;for(let j=p;j<n;j++)hits[k].push(Date.now());seen[k+i]=n;
  hits[k]=hits[k].filter(x=>Date.now()-x<10000);stats[k]=hits[k].length;if(hits[k].length>=3){hits[k]=[];ask(k+' x3',5)}}
 draw()}
function listen(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(APP||!R||S.off)return log('speech API unavailable');
 try{rec&&(rec.onend=null,rec.abort())}catch(e){}
 rec=new R();rec.continuous=true;rec.interimResults=true;rec.lang=S.lang=='hi'?'hi-IN':'en-IN';
 rec.onstart=()=>{mic=true;for(const k in seen)delete seen[k];draw()};
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLowerCase();const h=$('#heard');if(h)h.textContent=t.slice(-60);feed(i,t)}};
 rec.onerror=e=>{log('mic '+e.error);if(e.error=='not-allowed'||e.error=='service-not-allowed'){mic=false;draw()}};
 rec.onend=()=>{mic=false;if(!S.off)setTimeout(listen,400)};
 try{rec.start()}catch(e){}}
/* cough: short, sudden loud burst; 3 within 10 s -> silent SOS */
let cough=[],ctx=null;
async function coughInit(){
 if(APP||ctx)return;try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});ctx=new AudioContext();const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(s).connect(an);
 const d=new Float32Array(an.fftSize);let floor=.01,t0=0,peak=0;
 setInterval(()=>{if(S.off)return;an.getFloatTimeDomainData(d);let e=0,z=0;for(let i=0;i<d.length;i++){e+=d[i]*d[i];if(i&&d[i]*d[i-1]<0)z++}const r=Math.sqrt(e/d.length),zc=z/d.length;
  if(r>Math.max(.06,floor*5)&&zc>.04&&zc<.35){if(!t0){t0=Date.now();peak=r}}
  else{if(t0){const L=Date.now()-t0;if(L>80&&L<500){cough.push(Date.now());cough=cough.filter(x=>Date.now()-x<10000);stats.cough=cough.length;log('cough '+cough.length);if(cough.length>=3){cough=[];sos('cough x3',true)}draw()}t0=0}floor=floor*.97+r*.03}},30)}catch(e){log('cough '+e.message)}}

let ff=0;function fallInit(){const go=()=>addEventListener('devicemotion',e=>{if(S.nofall)return;const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x,a.y,a.z);if(m<3)ff=Date.now();else if(m>28&&Date.now()-ff<1000){ff=0;ask('fall',15,T().fall)}});
 if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)DeviceMotionEvent.requestPermission().then(r=>r=='granted'&&go()).catch(()=>{});else go()}

function gimg(d){if(d.open){const i=d.querySelector('img');if(!i.src)i.src=PI(i.dataset.p)}}
/* ---------- Gemini ---------- */
async function gem(q){
 const body={systemInstruction:{parts:[{text:'You are JASHPI, a women safety assistant. Answer in at most 5 very short key points, each on its own line starting with "• ". Plain text only: no markdown, no asterisks. If danger is mentioned, first point: advise calling 112 but never claim you placed a call and never offer to dial; only the user can call. '+T().sys}]},contents:[{parts:[{text:q}]}]};
 for(const m of['gemini-3-flash-preview','gemini-flash-latest','gemini-2.5-flash']){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':S.gkey},body:JSON.stringify(body)});
  const j=await r.json();if(r.ok){const t=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';return t.replace(/[*#`_]/g,'').replace(/^\s*[-•]\s*/gm,'• ').trim()}
  if(r.status!=404&&r.status!=400)throw new Error(j.error?.message||r.status)}
 throw new Error('Model unavailable')}

/* ---------- lock / calculator disguise / duress ---------- */
let expr='',locked=false;
function lock(){if(!S.pin)return;locked=true;expr='';calc()}
function calc(){const d=!!S.disg,o=$('#ov');o.classList.add('s');
 const k=['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','.','+'];
 o.innerHTML=`<div id="disp">${d?esc(expr||'0'):'•'.repeat(expr.length)||'PIN'}</div><div class="cal">${k.map(x=>`<button class="${'÷×−+'.includes(x)?'o':''}" data-k="${x}">${x}</button>`).join('')}<button style="grid-column:span 4" class="o" data-k="=">=</button></div>`;
 document.title=d?'Calculator':'JASHPI AI';
 o.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{const x=b.dataset.k;
  if(x=='C')expr='';else if(x=='='){const h=await sha('p:'+expr);
   if(h==S.pin){locked=false;expr='';o.classList.remove('s');document.title='JASHPI AI';return}
   if(h==S.dpin){locked=false;expr='';o.classList.remove('s');document.title='JASHPI AI';sos('duress pin',true);return}
   if(d){try{expr=String(Function('"use strict";return('+expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[^0-9+\-*/.]/g,'')+')')()).slice(0,12)}catch(e){expr='Error'}}else expr=''}
  else expr+=x;calc()})}
addEventListener('visibilitychange',()=>{if(document.hidden)window._h=Date.now();else if(S.pin&&Date.now()-(window._h||0)>20000)lock()});

/* ---------- views ---------- */
let tab='home';
function draw(){
 const t=T(),a=$('#app');
 if(!S.lang){a.innerHTML=`<div class="bar">${LOGO()}<b>JASHPI AI</b></div><h2>Choose language / भाषा चुनें</h2>`+[['en','English'],['hi','हिन्दी'],['hn','Hinglish']].map(([k,n])=>`<button class="opt" style="margin:8px 0;max-width:none" onclick="S.lang='${k}';save();draw()">${n}</button>`).join('');$('#nav').innerHTML='';return}
 if(!S.name){a.innerHTML=`<div class="bar">${LOGO()}<b>JASHPI AI</b></div><h2>${t.name}</h2><input id="nm" autocomplete="name" autofocus><button class="opt" style="max-width:none" id="go">${t.go}</button>`;$('#nav').innerHTML='';
  $('#go').onclick=async()=>{const v=$('#nm').value.trim();if(!v)return;if(await sha('jashpi.v1:'+v)==DEV_HASH){S.dev=true;S.name='Developer'}else S.name=v;S.code=S.code||rnd(16);save();perm();watchLoc();start();draw()};return}
 if(!S.pin){a.innerHTML=`<div class="bar">${LOGO()}<b>JASHPI AI</b></div><h2>Set password</h2><p class="mu">App will look like a calculator. Type this password, then press = to open JASHPI.</p><input id="pw" inputmode="numeric" placeholder="Password (numbers)"><button class="opt" style="max-width:none" id="pb">${t.go}</button>`;$('#nav').innerHTML='';$('#pb').onclick=async()=>{const v=$('#pw').value.replace(/\D/g,'');if(v.length<3)return;S.pin=await sha('p:'+v);S.disg=true;save();draw();lock()};return}
 $('#nav').innerHTML=[['home',t.home],['ct',t.ct],['gd',t.gd],['tl',t.tl],['ai',t.ai],['st',t.st]].map(([k,n])=>`<button class="${tab==k?'a':''}" onclick="tab='${k}';draw()">${n}</button>`).join('');
 const bar=`<div class="bar">${LOGO()}<b>JASHPI AI</b><span class="chip ${mic&&!S.off?'on':''}">${mic&&!S.off?t.lis:t.off}</span></div>`;
 if(tab=='home')a.innerHTML=bar+`<div class="hero"><div class="ring ${mic?'live':''}"><button class="sosb" onclick="ask('button',5)">${t.sos}</button></div></div>
 <p class="mu" style="text-align:center;min-height:22px" id="heard"></p>
 ${mic?'':`<button class="opt" style="max-width:none" onclick="start()">${t.tap}</button>`}
 <div class="card row"><span class="mu" style="flex:2">🎙 ${mic?'Mic OK':'Mic off'} · 📍 ${lastPos?'Location OK':'Location off'}</span><button class="g" onclick="perm()">Allow</button></div>
 <div class="card"><div class="tg"><div>Bachao<b>${stats.bachao}/3</b></div><div>Help<b>${stats.help}/3</b></div><div>Cough<b>${stats.cough}/3</b></div></div><p class="mu">"Hello Jashpi" · "Bachao" ×3 · "Help me" / "Madad karo" ×3 · Cough ×3</p></div>`;
 if(tab=='ct'){const c=S.contacts||[];a.innerHTML=bar+`<h2>${t.ct}</h2><div class="card">${c.map((x,i)=>`<div class="ct"><span>${i?'':'★ '}${esc(x.name)}<br><small class="mu">${esc(x.phone)}</small></span><button class="g" onclick="S.contacts.splice(${i},1);save();draw()">✕</button></div>`).join('')||'<p class="mu">—</p>'}
  <input id="cn" placeholder="${t.nm}"><input id="cp" type="tel" placeholder="${t.ph}"><button style="width:100%" id="ca">${t.add}</button></div>
  <div class="card"><button class="g" style="width:100%" id="tgb">${t.tgl}</button><p class="mu" id="tgs"></p></div>`;
  $('#ca')&&($('#ca').onclick=()=>{const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||p.replace(/\D/g,'').length<8)return;(S.contacts=S.contacts||[]).push({name:n,phone:p.startsWith('+')?p:'+'+p.replace(/\D/g,'')});save();draw()});
  fetch(RELAY()+'/subs/'+S.code).then(r=>r.json()).then(j=>{S.tg=j.ids&&j.ids.length?j.ids:S.tg;save();$('#tgs').textContent=(j.count||0)+' Telegram linked'}).catch(()=>{});
  $('#tgb').onclick=async()=>{try{const i=await fetch(RELAY()+'/info').then(r=>r.json()),u=`https://t.me/${i.bot}?start=${S.code}`;navigator.share?navigator.share({text:'Join my JASHPI safety alerts:',url:u}).catch(()=>{}):(navigator.clipboard.writeText(u),$('#tgs').textContent=u)}catch(e){$('#tgs').textContent='Relay offline'}}}
 if(tab=='gd'){const hn=S.lang!='en';a.innerHTML=bar+`<h2>${t.gd}</h2><div class="card"><div class="heart ${cpr?'b':''}">❤️</div><button style="width:100%" onclick="heart()">${cpr?'Stop':'CPR beat 110/min'}</button></div>`+G.map(g=>`<details ontoggle="gimg(this)"><summary>${esc(hn?g[2]:g[1])}</summary><img class="gi" alt="" data-p="${esc(g[0])}" onload="this.classList.add('ok')" onerror="this.style.display='none'"><ol>${(hn?g[5]:g[3]).split('|').map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`).join('')+`<div class="card"><div class="row">${[['112','Emergency'],['100','Police'],['1091','Women'],['181','Women 24x7'],['102','Ambulance'],['108','Ambulance'],['1098','Child'],['1930','Cyber']].map(([n,l])=>`<a class="btn" href="tel:${n}">${n}<br><small>${l}</small></a>`).join('')}</div></div>`}
 if(tab=='tl')a.innerHTML=bar+`<h2>${t.tl}</h2><div class="tl"><button class="${sir?'d':''}" onclick="tSiren()">🔊 Siren</button><button onclick="fake()">📞 Fake call</button><button onclick="strobe()">🔦 Strobe</button><button onclick="recAudio()">🎙 Record</button><button onclick="shareLive()">📍 Share live</button><button class="g" onclick="stopShare()">⏹ Stop share</button><button onclick="near('police+station')">🚓 Police</button><button onclick="near('hospital')">🏥 Hospital</button><button onclick="near('pharmacy')">💊 Pharmacy</button><a class="btn" href="tel:112" style="background:var(--r)">112</a></div>
 <p class="mu" id="fs"></p><p class="mu" id="rs"></p><p class="mu" id="ls" style="word-break:break-all"></p>
 <div class="card"><h3>Safety timer</h3><div class="row">${[5,15,30,60].map(m=>`<button class="g" onclick="stim(${m})">${m} min</button>`).join('')}</div><p class="mu" id="ts">If you don't confirm, SOS is sent.</p></div>`;
 if(tab=='ai')a.innerHTML=bar+`<h2>${t.ai}</h2><div class="card"><input id="gk" type="password" placeholder="${t.key}" value="${esc(S.gkey||'')}"><textarea id="q" rows="3" placeholder="${t.askp}"></textarea><button style="width:100%" id="qa">${t.send}</button><p id="ans" style="white-space:pre-wrap"></p></div>`,
  $('#qa').onclick=async()=>{S.gkey=$('#gk').value.trim();save();const q=$('#q').value.trim();if(!q||!S.gkey)return;$('#ans').textContent='…';try{$('#ans').textContent=await gem(q);if(/\b(call|dial|phone)\b|कॉल|112|1091/i.test(q))$('#ans').insertAdjacentHTML('afterend','<a class="btn" href="tel:112">112</a>')}catch(e){$('#ans').textContent='Error: '+e.message}};
 if(tab=='st')a.innerHTML=bar+`<h2>${t.st}</h2><div class="card"><h3>Language</h3><div class="row">${['en','hi','hn'].map(k=>`<button class="${S.lang==k?'':'g'}" onclick="S.lang='${k}';save();listen();draw()">${{en:'EN',hi:'हिं',hn:'Hinglish'}[k]}</button>`).join('')}</div><p class="mu">Alert code: <b>${S.code}</b></p></div>
 <div class="card"><h3>PIN</h3><input id="p1" inputmode="numeric" placeholder="New password"><input id="p2" inputmode="numeric" placeholder="Duress password (silent alert)"><div class="row"><button id="sp">Save</button><button class="g" onclick="lock()">Lock now</button></div></div>
 <div class="card"><label class="mu"><input type="checkbox" id="aw" style="width:auto" ${S.awake?'checked':''}> Keep screen awake</label><br><label class="mu"><input type="checkbox" id="nf" style="width:auto" ${S.nofall?'':'checked'}> Fall detection</label></div>
 ${S.dev?`<div class="card"><h3>Developer</h3><input id="rl" placeholder="Relay URL" value="${esc(S.relay||'')}"><div class="row"><button class="g" id="rs">Save</button><button class="g" onclick="sos('dev test',true)">Silent test</button><button class="g" onclick="feed(0,'bachao bachao bachao')">Bachao×3</button></div><pre id="log"></pre></div>`:''}`,
  (()=>{$('#sp').onclick=async()=>{const a=$('#p1').value,b=$('#p2').value;if(a&&a!=b){S.pin=await sha('p:'+a);if(b)S.dpin=await sha('p:'+b)}S.disg=true;save();draw()};
   $('#aw').onchange=e=>{S.awake=e.target.checked;save();wake()};$('#nf').onchange=e=>{S.nofall=!e.target.checked;save()};
   if(S.dev){$('#rs').onclick=()=>{S.relay=$('#rl').value.trim();save()};$('#log').textContent=LOG.join('\n')}})();
}
/* ---------- boot ---------- */
addEventListener('click',()=>{if(S.name&&!mic&&!S.off)listen()},{once:true});
const A=new URLSearchParams(location.search).get('a');
if(A)tab={guide:'gd',ai:'ai'}[A]||'home';
draw();
if(S.pin)lock();save();
if(S.name){watchLoc();listen();coughInit();fallInit();wake();if(A=='sos')ask('shortcut',5)}
