<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1030"><title>JASHPI AI</title>
<link rel="icon" id="fav"><link rel="manifest" id="mf"><link rel="apple-touch-icon" id="ati">
<style>
:root{--ink:#0B1030;--card:#151B47;--line:#2a3370;--tx:#EEF1FF;--mu:#9aa3d6;--b:#2F6BFF;--c:#19D3F2;--v:#8B5CF6;--r:#FF3D5A;--g:linear-gradient(135deg,var(--b),var(--c) 50%,var(--v))}
html{overscroll-behavior:none}body:has(.ov.s){overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;touch-action:manipulation;background:radial-gradient(800px 480px at 85% -8%,#3a2b8a66,transparent),radial-gradient(640px 400px at -10% 6%,#19D3F233,transparent),var(--ink);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
main{max-width:520px;margin:0 auto;padding:12px 16px 100px}
h2{font-size:22px;margin:6px 0 12px}h3{margin:0 0 8px;font-size:16px}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0 10px}.bar b{font-size:20px;letter-spacing:.5px}.bar i{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{margin-left:auto;font-size:13px;padding:5px 12px;border-radius:99px;background:#ffffff0d;border:1px solid var(--line)}.chip.on{border-color:var(--c);color:var(--c);box-shadow:0 0 14px #19d3f244}
.card{background:linear-gradient(160deg,#1a2152,#121744);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}.hi{margin:2px 0 0;font-size:18px;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:#0d1238;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;outline:none}input:focus,textarea:focus{border-color:var(--c)}
button{border:0;border-radius:14px;padding:12px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button.g{background:#232b62}button.d{background:var(--r)}button:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.hero{display:grid;place-items:center;padding:14px 0 4px}
.ring{position:relative;width:240px;height:240px}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--b),var(--c),var(--v),var(--b));animation:spin 6s linear infinite paused}.ring.live:before{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.rp{position:absolute;inset:0;border-radius:50%;border:2px solid var(--r);opacity:0}.ring.live .rp{animation:rip 2.4s ease-out infinite}.rp.r2{animation-delay:1.2s!important}
@keyframes rip{from{transform:scale(.95);opacity:.7}to{transform:scale(1.55);opacity:0}}
.sosb{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7088,var(--r) 60%,#c4163a);font-size:46px;font-weight:800;letter-spacing:3px;box-shadow:0 0 50px #ff3d5a77,inset 0 -10px 30px #0004}
.heard{min-height:46px;text-align:center;font-size:18px;color:var(--c);padding:8px 4px;word-break:break-word}.heard.f{animation:fl .8s}@keyframes fl{0%{color:#fff;text-shadow:0 0 20px var(--c)}}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tg div{background:#0d1238;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mu)}.tg b{display:block;font-size:22px;color:var(--tx)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid4 button{background:#1d2558;padding:12px 2px;font-size:12px;line-height:1.3}.grid4 span{display:block;font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1440ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:10px 1px;font-size:11px;color:var(--mu)}nav button.a{color:var(--c)}nav span{display:block;font-size:20px}
.ov{height:100dvh;position:fixed;inset:0;background:#0B1030f5;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:12px;overflow:auto}.ov.s{display:flex}
#sirbar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--r);display:none;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;font-weight:700}#sirbar.s{display:flex}#sirbar button{background:#fff;color:var(--r)}
.big{font-size:96px;font-weight:800}.opt{width:100%;max-width:340px;padding:16px;font-size:19px}
.ct{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.ct span{flex:1}.ct .btn{width:auto;padding:10px 12px}
a.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#232b62;padding:12px;border-radius:14px;font-weight:600}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gc{background:linear-gradient(160deg,#1f2760,#151b47);border:1px solid var(--line);padding:16px 8px;font-size:15px}.gc .em{display:block;font-size:40px;animation:beat 1.6s ease-in-out infinite}
.heart{font-size:64px;text-align:center}.heart.b{animation:beat .545s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.22)}}
.imgbox{position:relative;width:100%;aspect-ratio:8/5;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#1b2260,#3a2b8a);margin:8px 0}
.imgbox .em{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;animation:beat 1.2s ease-in-out infinite}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}.imgbox img.ok{opacity:1;animation:kb 14s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.15) translate(-2%,-2%)}}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:30px;height:5px;border-radius:9px;background:#2a3382;transition:.4s}.dots i.on{background:var(--c)}
.stp{min-height:92px;animation:up .5s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl button,.tl a{padding:18px 8px;font-size:15px}
.cal{display:grid}
pre{white-space:pre-wrap;font:12px/1.4 monospace;max-height:160px;overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

/* ---------- SOS core ---------- */
let busy=false,tid=null,wid=null,lastPos=null,lastT=0,siren=null,sir=false,sharing=false,batt='',heard='';
navigator.getBattery&&navigator.getBattery().then(b=>batt=Math.round(b.level*100)).catch(()=>{});
const pos=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude};r(lastPos)},()=>r(lastPos),{enableHighAccuracy:true,timeout:6000,maximumAge:15000}):r(lastPos));
const post=(p,b)=>fetch(RELAY()+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b),keepalive:true}).then(r=>r.json());
function track(){tid=tid||rnd(10);if(wid!=null||!navigator.geolocation)return;wid=navigator.geolocation.watchPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude};if(Date.now()-lastT>5000){lastT=Date.now();post('/track',{id:tid,name:S.name,...lastPos}).catch(()=>{})}},e=>log('track '+e.message),{enableHighAccuracy:true})}
function untrack(){if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;tid=null}
function alarm(){stopAlarm();try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();a.resume&&a.resume();o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=.5;o.start();let f=700;const iv=setInterval(()=>{f=f==700?1100:700;o.frequency.value=f},400);siren={stop(){clearInterval(iv);try{o.stop();a.close()}catch(e){}}};sir=true;sbar()}catch(e){log('siren '+e)}}
function stopAlarm(){if(siren)siren.stop();siren=null;sir=false;sbar();if(tab=='tl')render()}
const sbar=()=>$('#sirbar').classList.toggle('s',sir);
function msgText(link,live){const med=[S.bg?'Blood '+S.bg:'',S.note||''].filter(Boolean).join(', ');return `${S.name||'User'} ${T().msg} ${link}`+(batt!==''?` | 🔋${batt}%`:'')+(med?` | ${med}`:'')+` | Live: ${live}`}
async function sos(why,silent){
 if(busy)return;busy=true;setTimeout(()=>busy=false,20000);log('SOS: '+why);
 if(navigator.vibrate&&!silent)navigator.vibrate([400,150,400,150,400]);
 const p=await pos();track();
 const map=p?`https://maps.google.com/?q=${p.lat},${p.lng}`:'(location unavailable)',text=msgText(map,`${RELAY()}/t/${tid}`);
 let r={};try{if(p)await post('/track',{id:tid,name:S.name,...p});r=await post('/sos',{code:S.code,ids:S.tg||[],text,...(p||{})})}catch(e){log('relay '+e);addEventListener('online',()=>post('/sos',{code:S.code,text}).catch(()=>{}),{once:true})}
 if(APP)try{Jashpi.sos(text,!!silent)}catch(e){}
 if(silent)return;
 alarm();const c=S.contacts||[],n=c.map(x=>x.phone.replace(/\D/g,''));
 if(!APP&&n[0]&&navigator.userActivation&&navigator.userActivation.isActive)location.href='tel:+'+n[0];
 sheet(`<h2>✅ ${T().sent}</h2><p class="mu">Telegram: ${r.sent||0}</p><button class="d opt" onclick="stopAlarm()">🔇 Stop siren</button>`+
 (n.length?`<a class="btn opt" href="sms:${n.map(x=>'+'+x).join(',')}?body=${encodeURIComponent(text)}">SMS (all)</a>`+c.map((x,i)=>`<a class="btn opt" target="_blank" href="https://wa.me/${n[i]}?text=${encodeURIComponent(text)}">WhatsApp: ${esc(x.name)}</a>`).join('')+`<a class="btn opt" href="tel:+${n[0]}">📞 ${T().call} ${esc(c[0].name)}</a>`:'<p>Add contacts first.</p>')+
 `<a class="btn opt" href="tel:112">112</a><button class="opt" onclick="imSafe()">🙂 ${T().safe}</button><button class="g opt" onclick="closeSheet()">OK</button>`)}
async function imSafe(){const t=`${S.name||'User'}: ${T().safe} ✅`;try{await post('/sos',{code:S.code,ids:S.tg||[],text:t})}catch(e){}if(APP)try{Jashpi.sos(t,true)}catch(e){}stopAlarm();closeSheet()}
let gT=0;
function sheet(h){const o=$('#ov');o.innerHTML=h;o.classList.add('s')}
function closeSheet(){clearInterval(gT);try{speechSynthesis.cancel()}catch(e){}stopAlarm();$('#ov').classList.remove('s');if(!sharing)untrack()}
let cd=null;
function ask(why,secs,msg){if(cd||busy)return;let n=secs;const draw=()=>sheet(`<div class="mu">${msg||T().sending}</div><div class="big">${n}</div><button class="d opt" onclick="stopCd()">${msg?T().ok:T().cancel}</button>`);draw();if(navigator.vibrate)navigator.vibrate(200);cd=setInterval(()=>{if(--n<=0){stopCd();sos(why)}else draw()},1000)}
function stopCd(){clearInterval(cd);cd=null;closeSheet()}

const hits={bachao:[],help:[]},seen={};let rec=null,mic=APP,deny=false,stats={bachao:0,help:0,cough:0};
const WK=/(hello|helo|hallo|hailo|hallow|हैलो|हेलो|हलो|हेल्लो)\s*(jash|jas|jaish|jesh|जश|जस|जैश|जैस|जेश|यश)\s*(p|b|f|्?प|्?ब)\s*(i|y|ee|ie|ी|ि)?/;
const KW={bachao:/bacha+o|bachau|bachav|bachaw|bachha+o|bacho\b|बचाओ|बचाव|बचाऊ|बचा\s*ओ/g,help:/\bhelp\b|हेल्प|madad|madat|mdad|मदद|मदत/g};
const flash=()=>{const h=$('#hs');if(h){h.classList.remove('f');h.offsetWidth;h.classList.add('f')}};
function feed(i,alts){
 if(S.off)return;if(typeof alts=='string')alts=[alts];alts=alts.map(x=>x.toLowerCase());
 if(!seen['w'+i]&&alts.some(x=>WK.test(x))){seen['w'+i]=1;flash();ask('wake word',5)}
 for(const k of['bachao','help']){let n=0;alts.forEach(x=>{n=Math.max(n,(x.match(KW[k])||[]).length)});const p=seen[k+i]||0;for(let j=p;j<n;j++)hits[k].push(Date.now());seen[k+i]=Math.max(p,n);
  hits[k]=hits[k].filter(x=>Date.now()-x<10000);stats[k]=hits[k].length;if(hits[k].length>=3){hits[k]=[];stats[k]=0;flash();ask(k+' x3',5)}}
 upd()}
function listen(){
 if(APP||S.off||deny)return;
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){heard='⚠ Voice needs Chrome';upd();return}
 try{rec&&(rec.onend=null,rec.abort())}catch(e){}
 rec=new R();rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=4;rec.lang=S.lang=='en'?'en-IN':'hi-IN';

let cough=[],ctx=null;
async function coughInit(){
 if(APP||ctx||!S.cough)return;try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});ctx=new AudioContext();const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(st).connect(an);
 const d=new Float32Array(an.fftSize);let floor=.01,t0=0;
 setInterval(()=>{if(S.off)return;an.getFloatTimeDomainData(d);let e=0,z=0;for(let i=0;i<d.length;i++){e+=d[i]*d[i];if(i&&d[i]*d[i-1]<0)z++}const r=Math.sqrt(e/d.length),zc=z/d.length;
  if(r>Math.max(.06,floor*5)&&zc>.04&&zc<.35){if(!t0)t0=Date.now()}
  else{if(t0){const L=Date.now()-t0;if(L>80&&L<500){cough.push(Date.now());cough=cough.filter(x=>Date.now()-x<10000);stats.cough=cough.length;if(cough.length>=3){cough=[];stats.cough=0;sos('cough x3',true)}upd()}t0=0}floor=floor*.97+r*.03}},30)}catch(e){log('cough '+e.message)}}
